name: CI

# First CI pipeline for this repo (performance audit #10) — lint/typecheck/
# test only, no deploy step. Doesn't touch the current manual deployment.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, pdo_sqlite, gd, zip, bcmath
          coverage: none

      # Before composer install, not after: its postAutoloadDump hook runs
      # `artisan package:discover`, which boots the app and resolves every
      # env() call — spatie/laravel-backup's own config validates its
      # notification 'to' address eagerly at that point, and with no .env
      # yet, MAIL_FROM_ADDRESS (its fallback) was null instead of
      # .env.example's placeholder, failing composer install outright
      # before a single test could run. Confirmed: this broke `composer
      # install` on every CI run since the workflow was added, regardless
      # of what a given commit touched.
      - name: Prepare environment
        run: cp .env.example .env

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Generate app key
        run: php artisan key:generate

      - name: Run tests
        run: composer test

  frontend-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:run

  admin-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: admin/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint
